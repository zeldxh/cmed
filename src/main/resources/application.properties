spring.application.name=cmed

# Se define el puerto por el que se escucha el servidor web.
server.port=91

# Se define el formato de hora del log de la consola.
logging.pattern.dateformat=hh:mm

# Se evita el uso de cache en desarrollo.
spring.thymeleaf.cache=false

# Conexion a la BD CitaMed en MySQL. Los valores se pueden sobreescribir con
# variables de entorno (ver .env.example); si no se definen, se usan estos valores
# por defecto de desarrollo local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/citamed_db}
spring.datasource.username=${DB_USERNAME:usuario_citamed}
spring.datasource.password=${DB_PASSWORD:la_Clave}

# Driver y plataforma de comunicacion.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostrar informacion SQL en el log.
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Correo saliente para las notificaciones de citas (investigacion adicional).
# Las credenciales se leen de variables de entorno, no se dejan escritas en el repositorio.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Si no hay credenciales configuradas, los envios fallan de forma controlada y quedan
# registrados igual en la tabla notificacion con exito = false.
